<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Apê do Rio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D6A70'/%3E%3Ccircle cx='16' cy='13' r='5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Cpath d='M5 23c2.75 0 2.75-2 5.5-2s2.75 2 5.5 2 2.75-2 5.5-2 2.75 2 5.5 2' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app mobile-first — cabeçalho branco fixo, conteúdo em coluna única, navegação inferior no celular e abas no topo no computador. */
:root{
  color-scheme:light;
  --bg:#F3F5F6;
  --surface:#FFFFFF;
  --surface-2:#F7F9F9;
  --ink:#1D2A31;
  --ink-2:#56656D;
  --ink-3:#8B979E;
  --line:#E3E8EA;
  --line-2:#EEF1F2;
  --accent:#2D6A70;
  --accent-ink:#FFFFFF;
  --accent-soft:#E5EFEF;
  --ok:#2F7D57; --ok-soft:#E6F3EC;
  --warn:#9A6519; --warn-soft:#FAF0DF;
  --bad:#B0453D; --bad-soft:#F8E7E5;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(29,42,49,.04),0 2px 8px rgba(29,42,49,.04);
  --nav-h:64px;
  --hol:#A4631A; --hol-bg:#FBF4E7; --hol-top:#F6E4C6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.i{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- cabeçalho ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-txt{min-width:0}
.brand h1{font-size:17px;line-height:1.15}
.brand small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px;color:var(--ink);background:var(--surface)}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11.5px;font-weight:800;margin-left:-6px}

/* ---------- navegação ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--ink-3);position:relative}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent)}
main{max-width:880px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
@media(min-width:820px){
  .nav{position:static;border:0;padding:0 16px 0;max-width:880px;margin:0 auto;gap:4px;background:none}
  .nav button{flex:none;flex-direction:row;gap:8px;font-size:14px;padding:10px 14px 12px;border-radius:0}
  .nav button.on::before{top:auto;bottom:-1px;left:10px;right:10px}
  main{padding-bottom:110px;padding-top:24px}
}

/* ---------- blocos ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:16px}
.sec-head .link{font-size:13.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.muted{color:var(--ink-3);font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fc);flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--line-2);color:var(--ink-2)}

/* ---------- status (painel) ---------- */
.status{padding:18px;display:flex;gap:16px;align-items:center}
.status-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.status-fam{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.status-fam .dot{width:12px;height:12px}
.status-meta{color:var(--ink-2);font-size:14px}
.status-count{text-align:center;padding-left:16px;border-left:1px solid var(--line);min-width:84px}
.status-count b{display:block;font-size:30px;font-weight:800;color:var(--accent);line-height:1.05}
.status-count span{font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.2;display:block}

.metrics{display:grid;grid-template-columns:repeat(3,1fr)}
.metric{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.metric+.metric{border-left:1px solid var(--line-2)}
.metric b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.metric span{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.25}

/* tabela de famílias */
.ftable{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,60px);align-items:center}
.ftable > div{padding:12px 6px;border-top:1px solid var(--line-2);align-self:stretch;display:flex;align-items:center}
.ftable > .c{justify-content:center}
.ftable > .h{border-top:0;padding-top:12px;padding-bottom:8px;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.ftable > .c{text-align:center;font-weight:700;font-size:16px}
.ftable > .n{padding-left:16px;display:flex;align-items:center;gap:9px;font-weight:700;min-width:0}
.ftable > .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftable > .h.c{font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:700}
.ftable > :nth-child(4n){padding-right:12px}

/* ---------- item de reserva ---------- */
.list{display:flex;flex-direction:column}
.list.card > .bk + .bk{border-top:1px solid var(--line-2)}
.bk{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.bk:hover{background:var(--surface-2)}
.bk-date{width:48px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--fc) 16%,var(--surface));color:color-mix(in srgb,var(--fc) 60%,var(--ink));display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.bk-date b{font-size:19px;font-weight:800;line-height:1}
.bk-date small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.bk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bk-fam{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.bk-fam span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.bk-side b{font-size:14px;font-weight:700}
.bk.past{opacity:.6}

.empty{padding:28px 16px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px}
.empty .ei{width:44px;height:44px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;color:var(--ink-3)}

/* ---------- filtros ---------- */
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,42,49,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.chip.on.fam{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 12%,var(--surface));color:var(--ink)}

/* ---------- calendário ---------- */
.cal-top{display:flex;align-items:center;gap:8px}
.cal-top h2{flex:1;font-size:19px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.btn-text{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.cal{overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal-dow div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);padding:9px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:62px;padding:5px 4px 6px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out .n{color:var(--line)}
.day.past .n{color:var(--ink-3)}
.day .n{font-size:12.5px;font-weight:700;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin-left:1px}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day:hover{background:var(--surface-2)}
.bar{height:18px;line-height:18px;font-size:10.5px;font-weight:700;padding:0 5px;background:color-mix(in srgb,var(--fc) 22%,var(--surface));color:color-mix(in srgb,var(--fc) 55%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:clip;margin:0 -5px 0 -4px;position:relative;z-index:1}
.bar.s{margin-left:0;border-radius:5px 0 0 5px;box-shadow:inset 2px 0 0 var(--fc)}
.bar.e{margin-right:0;border-radius:0 5px 5px 0}
.bar.s.e{border-radius:5px}
.day.past .bar{opacity:.55}
.more{font-size:10px;color:var(--ink-3);font-weight:700;padding-left:2px}
@media(min-width:820px){.day{min-height:92px;padding:7px 6px}.bar{font-size:12px;height:21px;line-height:21px;margin:0 -7px 0 -6px}}
.day.hol{background:var(--hol-bg)}
.day.hol.top{background:var(--hol-top)}
.day.hol .n{color:var(--hol)}
.day.hol.today .n{background:var(--hol);color:#FFFFFF}
.day.hol.past{background:color-mix(in srgb,var(--hol-bg) 55%,var(--surface))}
.hname{margin-top:auto;font-size:9.5px;font-weight:700;color:var(--hol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;padding-left:2px}
@media(min-width:820px){.hname{font-size:11px}}
.lg-sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hrow + .hrow{border-top:1px solid var(--line-2)}
.hdate{width:48px;height:52px;border-radius:12px;background:var(--hol-bg);color:var(--hol);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.hrow.top .hdate{background:var(--hol-top)}
.hdate b{font-size:19px;font-weight:800;line-height:1}
.hdate small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.hmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hmain b{font-size:15px;display:flex;align-items:center;gap:6px}
.hmain span{font-size:13px;color:var(--ink-2)}
.hside{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:42%}
.hside .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.hot{background:var(--hol-top);color:var(--hol)}
.bk-hol{font-size:12.5px;color:var(--hol);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quota{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.qchip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.qchip.cur{box-shadow:inset 0 0 0 1px var(--ink-3)}
.qchip.full{background:var(--bad-soft);color:var(--bad)}
.rule-warn{display:flex;gap:8px;align-items:flex-start;background:var(--bad-soft);color:var(--bad);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:600}
.ftable > .c.full{color:var(--bad)}
.ny-now{padding:18px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--fc) 8%,var(--surface));border-radius:var(--r) var(--r) 0 0}
.ny-fam{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.ny-fam .dot{width:13px;height:13px}
.ny-st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.ny-row{display:flex;align-items:center;gap:10px;padding:11px 16px}
.ny-row + .ny-row{border-top:1px solid var(--line-2)}
.ny-row.cur{background:var(--surface-2)}
.ny-row.past .nm{color:var(--ink-2)}
.ny-year{width:92px;font-size:12.5px;font-weight:700;color:var(--ink-2);flex:none}
.ny-row .nm{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.ny-row .nm > span:not(.pill){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ny-side{flex:none}
.ny-swaps{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ny-swap{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.ny-swap span{flex:1;min-width:0}
.ord-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2)}
.ord-row .ibtn{width:34px;height:34px}
.ord-row [data-up] svg{transform:rotate(90deg)}
.ord-row [data-down] svg{transform:rotate(90deg)}
.ibtn:disabled{opacity:.35}
.hol-note{display:flex;gap:8px;align-items:flex-start;background:var(--hol-bg);color:var(--hol);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}

/* ---------- financeiro ---------- */
.fin-total{padding:18px;display:flex;flex-direction:column;gap:12px}
.fin-total .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.prog{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.fin-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fin-split > div{display:flex;flex-direction:column;gap:2px}
.fin-split .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fin-split .lbl i{width:8px;height:8px;border-radius:2px;display:block}
.fin-split b{font-size:17px;font-weight:800}
.frow{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.frow + .frow{border-top:1px solid var(--line-2)}
.frow-top{display:flex;align-items:center;gap:9px}
.frow-top .nm{flex:1;min-width:0;font-weight:700}
.frow-top .vl{font-weight:700}
.frow .prog{height:6px}
.frow .prog i{background:var(--fc)}
.frow-sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.rate-line{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--ink-2)}
.rate-line b{color:var(--ink)}

/* ---------- formulários ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);outline:none;font-size:15px;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;min-height:72px;padding:11px 13px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=date]{min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 > *{min-width:0}
.form{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:var(--r-sm);font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);transition:opacity .15s,transform .08s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5}
.btn.full{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.btn.danger.armed{background:var(--bad);color:#FFFFFF;border-color:var(--bad)}
.btn.sm{height:38px;font-size:14px;padding:0 14px}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600}
.fam-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fam-pick button{height:46px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;align-items:center;gap:9px;font-size:14.5px;min-width:0}
.fam-pick button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam-pick button.on{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 12%,var(--surface));box-shadow:inset 0 0 0 1px var(--fc)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);height:46px;overflow:hidden}
.stepper button{width:52px;height:100%;display:grid;place-items:center;color:var(--accent)}
.stepper input{border:0;height:100%;text-align:center;font-weight:700;font-size:17px;box-shadow:none!important}
.total{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft)}
.total small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.total span{font-size:13.5px;color:var(--ink-2)}
.total b{font-size:22px;font-weight:800;color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;background:var(--sw);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}

/* ---------- detalhes ---------- */
.dl{display:flex;flex-direction:column}
.dl > div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line-2);font-size:14px}
.dl > div:first-child{border-top:0}
.dl dt{color:var(--ink-2)}
.dl dd{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.sheet-fam{display:flex;align-items:center;gap:10px}
.sheet-fam .dot{width:12px;height:12px}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.box h4{font-size:14px;display:flex;align-items:center;gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- admin ---------- */
.setting{padding:16px;display:flex;flex-direction:column;gap:14px}
.setting + .setting{border-top:1px solid var(--line-2)}
.acc-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.acc-row + .acc-row{border-top:1px solid var(--line-2)}
.acc-ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.acc-main{flex:1;min-width:0}
.acc-main b{display:block}
.acc-main span{display:block;font-size:13px;color:var(--ink-2)}

/* ---------- folha (modal) ---------- */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(29,42,49,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;display:flex;flex-direction:column;gap:16px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h3{font-size:19px}
.sheet-h .x{width:36px;height:36px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
@media(min-width:820px){.sheet-bg{align-items:center}.sheet{border-radius:20px;padding-top:18px}.grab{display:none}}
@keyframes up{from{transform:translateY(32px);opacity:0}}
@keyframes fade{from{opacity:0}}

.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:31;height:50px;padding:0 20px 0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(45,106,112,.28)}
@media(min-width:820px){.fab{bottom:24px;right:max(24px,calc(50vw - 440px))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#FFFFFF;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(29,42,49,.2);display:flex;align-items:center;gap:8px}
.hidden{display:none!important}
#bkRespHint:empty,#bkLenHint:empty{display:none}
.req{color:var(--bad);margin-left:2px}
.req-note{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.field.invalid > span{color:var(--bad)}
.field.invalid input,.field.invalid select{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.field.invalid .fam-pick button{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.field-err{font-size:12.5px;color:var(--bad);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div class="brand-txt"><h1>Apê do Rio</h1><small id="roleLabel">Agenda das famílias</small></div>
      </div>
      <button class="who" id="meBtn"></button>
    </div>
    <nav class="nav" id="tabs"></nav>
  </header>
  <main id="view"><div class="empty" style="padding-top:80px">Carregando agenda…</div></main>
  <button class="fab hidden" id="fab"></button>
</div>

<script src="/app.js"></script>
</body>
</html>
